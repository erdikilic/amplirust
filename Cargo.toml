[package]
name = "amplirust"
version = "0.1.1"
edition = "2024"
description = "In-silico PCR primer matching and product extraction tool"
license = "MIT"

[features]
default = ["parser_seqio"]
parser_seqio = ["seq_io"]
parser_needletail = ["needletail"]

[dependencies]
sassy = "0.1"                 # Approximate string matching with IUPAC
libdeflater = "1.25"          # Fast gzip decompression/compression
gzp = { version = "0.11", default-features = false, features = ["deflate_default"] }  # Multi-threaded gzip compression
clap = { version = "4", features = ["derive"] }
rayon = "1.10"                # Parallel processing
csv = "1.3"                   # CSV primer file parsing
glob = "0.3"                  # File glob pattern matching
anyhow = "1.0"                # Error handling
thiserror = "1.0"             # Custom errors
log = "0.4"
env_logger = "0.11"
num_cpus = "1.16"             # CPU count detection
indicatif = "0.17"            # Progress bars

# Optional FASTA parsers (choose one via features)
seq_io = { version = "0.3", optional = true }
needletail = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = true
codegen-units = 1
