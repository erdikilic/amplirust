name: Build Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: amplirust

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: "" # No extension for Linux
          
          # Windows (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe" # Extension for Windows
          
          # MacOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: ""
          
          # MacOS Apple Silicon (aarch64)
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ""

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --release --verbose

    # This step renames 'amplirust' -> 'amplirust-x86_64-unknown-linux-gnu'
    # We use 'shell: bash' to ensure the 'mv' command works the same on Windows
    - name: Rename Binary
      shell: bash
      run: |
        mv target/release/${{ env.PROJECT_NAME }}${{ matrix.suffix }} target/release/${{ env.PROJECT_NAME }}-${{ matrix.target }}${{ matrix.suffix }}

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ matrix.target }}
        path: target/release/${{ env.PROJECT_NAME }}-${{ matrix.target }}${{ matrix.suffix }}
