name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "*.*.*" # Trigger on SemVer-like tags such as 0.1.0
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: amplirust

# WRITING PERMISSION IS REQUIRED FOR RELEASES
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --release --verbose

    - name: Rename Binary
      shell: bash
      run: |
        mv target/release/${{ env.PROJECT_NAME }}${{ matrix.suffix }} target/release/${{ env.PROJECT_NAME }}-${{ matrix.target }}${{ matrix.suffix }}

    # 1. Upload as Artifact (Optional, useful for debugging build failures)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ matrix.target }}
        path: target/release/${{ env.PROJECT_NAME }}-${{ matrix.target }}${{ matrix.suffix }}

    # 2. Upload to Release (Only runs on tags)
    - name: Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: target/release/${{ env.PROJECT_NAME }}-${{ matrix.target }}${{ matrix.suffix }}
