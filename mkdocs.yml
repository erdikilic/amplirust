site_name: Amplirust
site_url: https://erdikilic.github.io/amplirust/
site_description: A high-performance in-silico PCR tool for primer matching and product extraction
repo_url: https://github.com/erdikilic/amplirust
repo_name: erdikilic/amplirust
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - CLI Reference: user-guide/usage.md
    - Primer Formats: user-guide/primer-formats.md
    - Output Formats: user-guide/output.md
    - Practical Examples: user-guide/examples.md
    - Algorithm: user-guide/algorithm.md
    - Performance: user-guide/performance.md
  - Contributing: contributing.md
  - Changelog: changelog.md
